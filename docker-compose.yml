version: "3.8"
services:
  db:
    image: postgis/postgis:15-3.4
    #restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.5
    #restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    image: sportsx_backend:dev
    # 调整为本地使用的证书
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --ssl-keyfile=/app/certs/192.168.1.4-key.pem --ssl-certfile=/app/certs/192.168.1.4.pem
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./resources:/app/resources
      - ./certs:/app/certs
      - ./log:/app/log
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  redisdata: