<!doctype html>
<html lang="{{ language }}">
  <body style="margin:0;padding:0;background:#f3f5fb;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f3f5fb;">
      <tr>
        <td align="center" style="padding:28px 12px;">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:20px;overflow:hidden;">
            <tr>
              <td style="padding:20px 28px 16px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td style="padding-right:10px;vertical-align:middle;"><img src="{{ app_icon_url }}" width="32" height="32" alt="Movmov" style="display:block;width:32px;height:32px;border:0;border-radius:8px;" /></td>
                    <td style="vertical-align:middle;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:18px;font-weight:700;color:#16213e;">Movmov</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr><td><img src="{{ hero_image_url }}" width="600" alt="{{ hero_alt }}" style="display:block;width:100%;height:auto;border:0;" /></td></tr>
            <tr>
              <td style="padding:32px 28px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#16213e;">
                <h1 style="margin:0;font-size:28px;line-height:1.3;letter-spacing:-0.4px;">{{ title }}</h1>
                <p style="margin:18px 0 0;font-size:16px;line-height:1.7;color:#4b5568;">{{ description }}</p>
                <ul style="margin:18px 0;padding-left:22px;font-size:15px;line-height:1.9;color:#4b5568;"><li>{{ feature_1 }}</li><li>{{ feature_2 }}</li><li>{{ feature_3 }}</li></ul>
              </td>
            </tr>
            <tr><td align="center" style="padding:18px 28px 32px;"><a href="https://apps.apple.com/app/6755963833" style="display:inline-block;background:#fd581b;color:#ffffff;text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:16px;font-weight:700;padding:14px 24px;border-radius:10px;">{{ cta }}</a></td></tr>
            <tr><td style="padding:22px 28px 28px;border-top:1px solid #edf0f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;text-align:center;"><p style="margin:0 0 10px;font-size:12px;line-height:1.6;color:#8a94a6;">{{ marketing_notice }}</p><a href="{{ unsubscribe_url }}" style="font-size:12px;color:#667085;text-decoration:underline;">{{ unsubscribe }}</a></td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
